name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pyyaml numpy pyvista
      - run: python scripts/validate_skills.py
      - run: python .agents/skills/csf-flow-postprocess/scripts/test_synthetic.py
      - run: python .agents/skills/drug-transport-postprocess/scripts/test_synthetic.py
      - run: python .agents/skills/csf-flow-postprocess/scripts/test_xdmf_end_to_end.py
      - run: python .agents/skills/drug-transport-postprocess/scripts/test_xdmf_end_to_end.py
